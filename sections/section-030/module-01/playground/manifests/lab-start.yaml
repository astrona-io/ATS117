# Client pod for every ATS117 environment: curl and jq, used by graders to
# call the OpenBao and Prometheus HTTP APIs.
apiVersion: v1
kind: Namespace
metadata:
  name: clients
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tester
  namespace: clients
  labels:
    app: tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tester
  template:
    metadata:
      labels:
        app: tester
    spec:
      containers:
        - name: tester
          image: nicolaka/netshoot:v0.13
          command: ["sh", "-c", "while true; do sleep 30; done"]

# Audit And Alert On The Cluster
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-lab-030-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-audit-device"
      description: "Confirms a file audit device is enabled"
      type: "file"
      source: "validation/validate-audit-device.sh"
    - name: "validate-audit-entries"
      description: "Confirms a request appears as an audit entry in the log of the leader"
      type: "file"
      source: "validation/validate-audit-entries.sh"
    - name: "validate-alert-rule"
      description: "Confirms the alert rule OpenBaoNoActiveNode is loaded, uses vault_core_active and evaluates without error"
      type: "file"
      source: "validation/validate-alert-rule.sh"
    - name: "validate-alert-quiet"
      description: "Confirms the alert OpenBaoNoActiveNode is not firing while the cluster has an active node"
      type: "file"
      source: "validation/validate-alert-quiet.sh"
    - name: "validate-data-kept"
      description: "Confirms the marker secret still exists"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - prom/prometheus:v3.15.1
      - quay.io/openbao/openbao:2.7.1

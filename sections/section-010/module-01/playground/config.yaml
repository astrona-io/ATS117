# Run OpenBao As A Raft Cluster (PLAYGROUND) — Playground environment
# A sandbox: it spins up, prepares the cluster, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-playground-010-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Installs Helm and the bao CLI, the CoreDNS rewrite, the tester pod and the three-node OpenBao cluster, then prepares the module's starting state."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1

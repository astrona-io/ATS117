# Retire A Node And Keep Quorum Safe
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-lab-010-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-three-voters"
      description: "Confirms the Raft configuration holds exactly openbao-0, openbao-1 and openbao-2, all voters"
      type: "file"
      source: "validation/validate-three-voters.sh"
    - name: "validate-autopilot-healthy"
      description: "Confirms autopilot reports a healthy cluster with a failure tolerance of 1"
      type: "file"
      source: "validation/validate-autopilot-healthy.sh"
    - name: "validate-volume-removed"
      description: "Confirms the PersistentVolumeClaim of the removed node is deleted"
      type: "file"
      source: "validation/validate-volume-removed.sh"
    - name: "validate-data-kept"
      description: "Confirms the marker secret written before the task still exists, so the cluster was not re-initialized"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1

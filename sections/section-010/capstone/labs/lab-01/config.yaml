# Restore Quorum And Remove A Dead Peer
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-capstone-010-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-peers"
      description: "Confirms the Raft configuration holds exactly openbao-0, openbao-1 and openbao-2, all voters"
      type: "file"
      source: "validation/validate-peers.sh"
    - name: "validate-writes"
      description: "Confirms the cluster has a leader and accepts a write"
      type: "file"
      source: "validation/validate-writes.sh"
    - name: "validate-autopilot-config"
      description: "Confirms autopilot removes dead servers and keeps a minimum quorum of 3"
      type: "file"
      source: "validation/validate-autopilot-config.sh"
    - name: "validate-data-kept"
      description: "Confirms the original data survived, so the cluster was recovered, not rebuilt"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1

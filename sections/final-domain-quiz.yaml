# Final domain knowledge check across all four sections.
schema_version: 1
kind: question_bank
id: ats117-final
course_id: ATS117
exam_code: OPENBAO
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: openbao-enterprise-operations
  title: "Enterprise Operations, Auto-Unseal & HA Clusters"
questions:
  - id: ats117-final-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Calculate quorum"
    source_readings:
      - sections/section-010/module-01/course-01-raft-voters-and-quorum.md
    prompt: "A cluster has 5 voters. How many must store a write before it is committed, and how many failures does the cluster survive?"
    options:
      - id: a
        text: "5 voters; 0 failures."
        explanation: "Not correct. Raft needs a majority, not all voters."
      - id: b
        text: "2 voters; 3 failures."
        explanation: "Not correct. Two of five is not a majority."
      - id: c
        text: "4 voters; 1 failure."
        explanation: "Not correct. A majority of five is three."
      - id: d
        text: "3 voters; 2 failures."
        explanation: "Correct. The quorum is (5 / 2) + 1, rounded down, which is 3."
    correct_option: d
    explanation: "Correct. The quorum is (5 / 2) + 1, rounded down, which is 3."

  - id: ats117-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a Shamir-sealed node waits"
    source_readings:
      - sections/section-010/module-01/course-02-joining-nodes-and-autopilot.md
    prompt: "A new pod with the Shamir seal runs retry_join but never appears in list-peers. What is missing?"
    options:
      - id: a
        text: "The pod needs a second retry_join block that points to itself."
        explanation: "Not correct. The addresses are the same in every pod."
      - id: b
        text: "The pod must be unsealed, because it needs the cluster keys to answer the leader's encrypted challenge."
        explanation: "Correct. Until it is unsealed it cannot prove it belongs."
      - id: c
        text: "The leader must be stepped down first."
        explanation: "Not correct. Joining does not need a step-down."
      - id: d
        text: "Autopilot must be turned off."
        explanation: "Not correct. Autopilot promotes the node after it joins."
    correct_option: b
    explanation: "Correct. Until it is unsealed it cannot prove it belongs."

  - id: ats117-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle a planned leader change"
    source_readings:
      - sections/section-010/module-01/course-03-failover-standbys-and-lost-quorum.md
    prompt: "You must restart the active node for a configuration change. What should you do first?"
    options:
      - id: a
        text: "Run bao operator step-down so the others elect a new leader before the restart."
        explanation: "Correct. Clients then see no errors during the restart."
      - id: b
        text: "Delete the standby pods so they do not vote."
        explanation: "Not correct. That removes voters and risks the quorum."
      - id: c
        text: "Run peers.json recovery on the leader."
        explanation: "Not correct. That is a disaster procedure."
      - id: d
        text: "Scale the StatefulSet to one replica."
        explanation: "Not correct. That leaves dead voters in the configuration."
    correct_option: a
    explanation: "Correct. Clients then see no errors during the restart."

  - id: ats117-final-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain recovery keys"
    source_readings:
      - sections/section-020/module-01/course-01-seals-and-recovery-keys.md
    prompt: "After a cluster is initialized with auto-unseal, what can recovery keys do?"
    options:
      - id: a
        text: "Unseal the cluster if the key service is gone."
        explanation: "Not correct. Recovery keys cannot unseal."
      - id: b
        text: "Decrypt a Raft snapshot without the seal key."
        explanation: "Not correct. They are not a backup of the key service."
      - id: c
        text: "Authorize operations such as generating a root token, but not unseal."
        explanation: "Correct. The key service does the unsealing."
      - id: d
        text: "Replace the Transit token."
        explanation: "Not correct. The token is a separate credential."
    correct_option: c
    explanation: "Correct. The key service does the unsealing."

  - id: ats117-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Create the seal token"
    source_readings:
      - sections/section-020/module-01/course-02-the-transit-seal.md
    prompt: "Which command creates a token that follows the OpenBao advice for the Transit seal?"
    options:
      - id: a
        text: "bao token create -ttl=24h -explicit-max-ttl=720h -policy=autounseal"
        explanation: "Not correct. A maximum TTL stops the renewals one day."
      - id: b
        text: "bao token create -orphan -period=24h -policy=autounseal"
        explanation: "Correct. It is an orphan, periodic token with the limited policy."
      - id: c
        text: "bao token create -policy=root"
        explanation: "Not correct. The root policy is far too broad."
      - id: d
        text: "bao token create -ttl=1h -policy=default"
        explanation: "Not correct. The default policy cannot call encrypt or decrypt."
    correct_option: b
    explanation: "Correct. It is an orphan, periodic token with the limited policy."

  - id: ats117-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order the migration steps"
    source_readings:
      - sections/section-020/module-01/course-03-migrating-from-shamir-to-transit.md
    prompt: "What is the order of a seal migration on an Integrated Storage cluster?"
    options:
      - id: a
        text: "Restart all pods at once, then run unseal -migrate on the leader."
        explanation: "Not correct. Raft needs a quorum during the migration."
      - id: b
        text: "Step the leader down, then add the seal to the configuration."
        explanation: "Not correct. The configuration comes first."
      - id: c
        text: "Delete the Shamir key shares, then restart the leader."
        explanation: "Not correct. The shares become the recovery keys."
      - id: d
        text: "Add the seal to the configuration, restart and unseal each standby with -migrate, step the leader down, restart the old leader."
        explanation: "Correct. The migrated standby performs the migration after the step-down."
    correct_option: d
    explanation: "Correct. The migrated standby performs the migration after the step-down."

  - id: ats117-final-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the metrics endpoint"
    source_readings:
      - sections/section-030/module-01/course-01-telemetry-and-the-metrics-endpoint.md
    prompt: "Why does a scrape of /v1/sys/metrics need format=prometheus?"
    options:
      - id: a
        text: "It selects which node answers the request."
        explanation: "Not correct. The target address selects the node."
      - id: b
        text: "It turns off the token check."
        explanation: "Not correct. That is unauthenticated_metrics_access."
      - id: c
        text: "Without it the endpoint answers with JSON, which Prometheus cannot read."
        explanation: "Correct. The parameter selects the exposition format."
      - id: d
        text: "It adds the vault_ prefix to the names."
        explanation: "Not correct. The prefix is always there."
    correct_option: c
    explanation: "Correct. The parameter selects the exposition format."

  - id: ats117-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose scrape targets"
    source_readings:
      - sections/section-030/module-01/course-02-scraping-every-node-with-prometheus.md
    prompt: "Why does the scrape job list each pod through the headless Service openbao-internal?"
    options:
      - id: a
        text: "Each pod has its own stable DNS name, so every node becomes its own target."
        explanation: "Correct. A normal Service picks one pod per request."
      - id: b
        text: "A headless Service encrypts the metrics in transit."
        explanation: "Not correct. It only provides DNS names."
      - id: c
        text: "It makes Prometheus skip sealed pods."
        explanation: "Not correct. A sealed pod should still be a target."
      - id: d
        text: "It gives all pods the same IP address."
        explanation: "Not correct. Each pod keeps its own address."
    correct_option: a
    explanation: "Correct. A normal Service picks one pod per request."

  - id: ats117-final-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Alert on a sealed node"
    source_readings:
      - sections/section-030/module-01/course-03-key-metrics-and-the-health-endpoint.md
    prompt: "Why does the OpenBaoNodeSealed rule use vault_core_unsealed == 0 or up{job=\"openbao\"} == 0?"
    options:
      - id: a
        text: "up == 0 is needed because gauges cannot be compared with 0."
        explanation: "Not correct. Gauges can be compared."
      - id: b
        text: "The second part makes the alert fire on the leader only."
        explanation: "Not correct. Both parts apply to every instance."
      - id: c
        text: "The rule needs two conditions to be valid YAML."
        explanation: "Not correct. One condition would be valid."
      - id: d
        text: "A sealed node may report 0 or may stop answering, so the rule covers both cases."
        explanation: "Correct. If the metric disappears, only up shows the problem."
    correct_option: d
    explanation: "Correct. If the metric disappears, only up shows the problem."

  - id: ats117-final-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Take a snapshot"
    source_readings:
      - sections/section-040/module-01/course-01-raft-snapshots.md
    prompt: "Where do you run bao operator raft snapshot save?"
    options:
      - id: a
        text: "On a sealed standby, to avoid load on the leader."
        explanation: "Not correct. A sealed node answers almost nothing."
      - id: b
        text: "Against the leader, with a token that may use sys/storage/raft/snapshot."
        explanation: "Correct. The same data is available as a GET request on that path."
      - id: c
        text: "On the unsealer server only."
        explanation: "Not correct. The unsealer holds a different cluster."
      - id: d
        text: "With no token, because snapshots are public."
        explanation: "Not correct. A token with permission is required."
    correct_option: b
    explanation: "Correct. The same data is available as a GET request on that path."

  - id: ats117-final-q11
    type: single_choice
    difficulty: advanced
    learning_objective: "Keep later changes"
    source_readings:
      - sections/section-040/module-01/course-02-restoring-a-snapshot.md
    prompt: "How do you keep a legitimate change made after the snapshot?"
    options:
      - id: a
        text: "Read it before the restore and write it again afterwards."
        explanation: "Correct. The restore deletes it, so reading must come first."
      - id: b
        text: "Restore with -force."
        explanation: "Not correct. -force skips the key check and keeps nothing."
      - id: c
        text: "Restore on a standby."
        explanation: "Not correct. Run the restore on the active node."
      - id: d
        text: "Restore twice in a row."
        explanation: "Not correct. The second restore also rolls it back."
    correct_option: a
    explanation: "Correct. The restore deletes it, so reading must come first."

  - id: ats117-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order an upgrade"
    source_readings:
      - sections/section-040/module-01/course-03-rolling-upgrades.md
    prompt: "What is the order of a rolling upgrade?"
    options:
      - id: a
        text: "Upgrade the leader first, then the standbys."
        explanation: "Not correct. The leader goes last."
      - id: b
        text: "Delete all pods, then unseal them together."
        explanation: "Not correct. That loses the quorum."
      - id: c
        text: "Snapshot first, standbys one at a time, step the leader down, upgrade the old leader last."
        explanation: "Correct. The cluster elects a new leader only once."
      - id: d
        text: "Upgrade standbys, then take a snapshot."
        explanation: "Not correct. The snapshot comes first."
    correct_option: c
    explanation: "Correct. The cluster elects a new leader only once."

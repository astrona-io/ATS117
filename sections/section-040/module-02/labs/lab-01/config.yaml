# Create A Backup Token
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-lab-040-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-lab-040-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-token-secret"
      description: "Confirms the Secret snapshot-backup-token holds an orphan, periodic token with the policy snapshot-backup and without root"
      type: "file"
      source: "validation/validate-token-secret.sh"
    - name: "validate-can-snapshot"
      description: "Confirms the backup token can read the Raft snapshot"
      type: "file"
      source: "validation/validate-can-snapshot.sh"
    - name: "validate-cannot-read-or-restore"
      description: "Confirms the backup token can neither read a secret nor restore a snapshot"
      type: "file"
      source: "validation/validate-cannot-read-or-restore.sh"
    - name: "validate-data-kept"
      description: "Confirms the marker secret still exists"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1

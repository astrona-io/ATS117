# Back Up, Restore And Upgrade OpenBao (PLAYGROUND) — Playground environment
# A sandbox: it spins up, prepares the cluster, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-playground-040-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Installs Helm and the bao CLI, the CoreDNS rewrite, the tester pod and the three-node OpenBao cluster, then prepares the module's starting state."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false

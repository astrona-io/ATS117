# Restore A Deleted Secret From A Snapshot
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-secret-restored"
      description: "Confirms secret/payments/db is back with its value from the snapshot"
      type: "file"
      source: "validation/validate-secret-restored.sh"
    - name: "validate-later-change-kept"
      description: "Confirms secret/payments/api, written after the snapshot, still exists with its value"
      type: "file"
      source: "validation/validate-later-change-kept.sh"
    - name: "validate-cluster-healthy"
      description: "Confirms three voters, a leader and every pod unsealed"
      type: "file"
      source: "validation/validate-cluster-healthy.sh"
    - name: "validate-data-kept"
      description: "Confirms the marker secret exists, so the cluster was restored, not re-initialized"
      type: "file"
      source: "validation/validate-data-kept.sh"

teardown:
  keepCluster: false

# Migrate The Cluster From Shamir To Transit Auto-Unseal
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-lab-020-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"

testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-seal-type"
      description: "Confirms every pod is unsealed and uses the Transit seal"
      type: "file"
      source: "validation/validate-seal-type.sh"
    - name: "validate-recovery-keys"
      description: "Confirms the cluster now has recovery keys instead of unseal keys"
      type: "file"
      source: "validation/validate-recovery-keys.sh"
    - name: "validate-auto-unseal"
      description: "Restarts a pod and confirms it unseals itself"
      type: "file"
      source: "validation/validate-auto-unseal.sh"
    - name: "validate-data-kept"
      description: "Confirms the data written before the migration is still there"
      type: "file"
      source: "validation/validate-data-kept.sh"

teardown:
  keepCluster: false

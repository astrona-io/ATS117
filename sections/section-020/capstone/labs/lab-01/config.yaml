# Repair A Transit Seal That Stopped Working
# Astrona graded capstone. Schema: internal/config.LabConfig.

metadata:
  name: "ats-117-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-openbao"
      description: "Installs Helm 3.22.1, the bao CLI 2.7.1, the CoreDNS rewrite, the tester pod and the OpenBao cluster (chart 0.30.4)"
      type: "file"
      source: "bootstrap/01-install-openbao.sh"
    - name: "ats-117-capstone-020-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "The tester pod (namespace clients)."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-openbao"
      description: "Waits until the cluster and the starting state are ready"
      type: "file"
      source: "testing/wait-for-openbao.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-all-unsealed"
      description: "Confirms every pod is unsealed with the Transit seal"
      type: "file"
      source: "validation/validate-all-unsealed.sh"
    - name: "validate-seal-token"
      description: "Confirms the token in transit-seal-token is valid, orphan, periodic and limited to the autounseal policy"
      type: "file"
      source: "validation/validate-seal-token.sh"
    - name: "validate-key-name"
      description: "Confirms the Helm values name the Transit key autounseal"
      type: "file"
      source: "validation/validate-key-name.sh"
    - name: "validate-auto-unseal"
      description: "Restarts a standby and confirms it unseals itself"
      type: "file"
      source: "validation/validate-auto-unseal.sh"
    - name: "validate-data-kept"
      description: "Confirms the data written before the fault is still there"
      type: "file"
      source: "validation/validate-data-kept.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - docker.io/hashicorp/vault-k8s:1.7.6
      - nicolaka/netshoot:v0.13
      - quay.io/openbao/openbao:2.7.1

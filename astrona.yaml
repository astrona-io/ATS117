# Course manifest for ATS117 - Enterprise Operations, Auto-Unseal & HA
# Clusters (OpenBao).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS117
  title: "OpenBao: Enterprise Operations, Auto-Unseal & HA Clusters"
  maturity: draft
  description: >
    Training material covering the Enterprise Operations, Auto-Unseal & HA
    Clusters domain of the OpenBao training path: a three-node cluster on
    Integrated Storage (Raft), quorum and autopilot, Transit and static
    auto-unseal, cloud KMS plugins, seal migration, telemetry with
    Prometheus and the health endpoint, Raft snapshots and restore, and
    rolling upgrades. Each module pairs a layered reader with an ungraded
    hands-on playground and a graded practice lab. Each section closes with
    an integration capstone.
    Written for OpenBao v2.7.1.

  certification:
    name: OpenBao
    code: OPENBAO
    provider: Astrona
    domain: Enterprise Operations, Auto-Unseal & HA Clusters
    weight: 15

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "High Availability With Integrated Storage"
    description: >
      Run OpenBao as a three-node cluster on Integrated Storage: Raft, voters
      and quorum, joining nodes with retry_join, autopilot, leader election,
      standby reads and request forwarding, and what to do when quorum is
      lost.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Run OpenBao As A Raft Cluster"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Raft, Voters And Quorum"
        path: sections/section-010/module-01/course-01-raft-voters-and-quorum.md
      - type: reading
        title: "Joining Nodes And Autopilot"
        path: sections/section-010/module-01/course-02-joining-nodes-and-autopilot.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Join The Third Node And Configure Autopilot Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: high-availability
        task_kind: troubleshooting
        tags: [raft, retry-join, list-peers, autopilot, quorum, standby]
        learning_goals:
          - Find why a node is missing from the Raft configuration and bring it in as a voter
          - Configure autopilot to remove dead servers while keeping a minimum quorum
          - Prove the cluster keeps accepting writes when the leader pod is lost
        resources:
          - name: "Integrated Storage"
            url: https://openbao.org/docs/concepts/integrated-storage/
          - name: "Autopilot"
            url: https://openbao.org/docs/concepts/integrated-storage/autopilot/
          - name: "operator raft"
            url: https://openbao.org/docs/commands/operator/raft/
      - type: reading
        title: "Failover, Standbys And Lost Quorum"
        path: sections/section-010/module-01/course-03-failover-standbys-and-lost-quorum.md
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Restore Quorum And Remove A Dead Peer Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: high-availability
        task_kind: troubleshooting
        tags: [raft, quorum, list-peers, remove-peer, autopilot, standby]
        learning_goals:
          - Recognise a cluster that lost quorum and bring enough voters back to elect a leader
          - Remove a dead peer from the Raft configuration
          - Configure autopilot so dead servers are cleaned up in future
        resources:
          - name: "Integrated Storage: quorum lost"
            url: https://openbao.org/docs/concepts/integrated-storage/
          - name: "High availability"
            url: https://openbao.org/docs/concepts/ha/

  - id: module-020
    title: "Auto-Unseal"
    description: >
      Unseal OpenBao without people entering key shares: recovery keys, the
      Transit seal backed by a second OpenBao, the static seal, cloud KMS
      seals as plugins, and migrating a running cluster from Shamir to
      Transit.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-020/README.md

      - type: reading
        title: "Unseal OpenBao Automatically"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Seals, Auto-Unseal And Recovery Keys"
        path: sections/section-020/module-01/course-01-seals-and-recovery-keys.md
      - type: reading
        title: "The Transit Seal"
        path: sections/section-020/module-01/course-02-the-transit-seal.md
      - type: reading
        title: "Migrating From Shamir To Transit"
        path: sections/section-020/module-01/course-03-migrating-from-shamir-to-transit.md
      - type: reading
        title: Question
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Migrate The Cluster From Shamir To Transit Auto-Unseal Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: advanced
        estimated_duration: 30m
        topic: auto-unseal
        task_kind: migration
        tags: [transit-seal, seal-migration, recovery-keys, step-down, ondelete, helm-chart]
        learning_goals:
          - Add a Transit seal to the cluster configuration with its token from a Kubernetes Secret
          - Migrate every node with unseal -migrate, standbys first and the leader last
          - Prove that a restarted pod unseals itself and the data survived
        resources:
          - name: "Seal concepts and seal migration"
            url: https://openbao.org/docs/concepts/seal/
          - name: "Transit seal"
            url: https://openbao.org/docs/configuration/seal/transit/
          - name: "operator unseal"
            url: https://openbao.org/docs/commands/operator/unseal/
      - type: reading
        title: Summary
        path: sections/section-020/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair A Transit Seal That Stopped Working Capstone"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 35m
        topic: auto-unseal
        task_kind: troubleshooting
        tags: [transit-seal, periodic-token, recovery-keys, ondelete, helm-chart, step-down]
        learning_goals:
          - Find why a pod cannot auto-unseal from its log and the unsealer
          - Replace a revoked seal token with an orphan, periodic, least-privilege token
          - Fix the seal configuration and roll it out so every pod unseals itself
        resources:
          - name: "Transit seal: authentication"
            url: https://openbao.org/docs/configuration/seal/transit/
          - name: "Tokens"
            url: https://openbao.org/docs/concepts/tokens/

  - id: module-030
    title: "Telemetry And Monitoring"
    description: >
      Make OpenBao report its own health: the telemetry stanza, the metrics
      endpoint without a token, scraping every node with Prometheus, the key
      metrics to watch, alerting on a sealed node, and the health endpoint
